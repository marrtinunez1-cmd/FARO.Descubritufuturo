<!DOCTYPE html>
<html lang="es">
<head>

<title>FARO · Descubrí tu futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --navy-900:#0B2545;
    --blue-800:#163B63;
    --blue-700:#1C4E82;
    --blue-600:#2566A8;
    --blue-500:#3D7DC2;
    --blue-400:#6FA0D6;
    --blue-200:#BFD9F2;
    --blue-100:#DCEAFB;
    --blue-50:#F2F8FE;
    --gray-600:#5B6B7B;
    --gray-400:#94A3B3;
    --error:#A8392F;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 6px 24px rgba(11,37,69,0.08);
    --font-display:'Poppins',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--white);
    color:var(--navy-900);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:640px;margin:0 auto;padding:0 20px 60px;}

  /* ===== Header ===== */
  .topbar{
    position:relative;
    padding:28px 20px 22px;
    text-align:center;
    overflow:hidden;
    border-bottom:1px solid var(--blue-100);
    margin-bottom:28px;
  }
  .beam{
    position:absolute;
    top:-120px; left:50%;
    width:320px; height:320px;
    transform:translateX(-50%);
    background:conic-gradient(from 0deg, transparent 0deg, var(--blue-100) 18deg, transparent 40deg, transparent 360deg);
    animation:sweep 7s linear infinite;
    pointer-events:none;
    opacity:.8;
  }
  @media (prefers-reduced-motion: reduce){ .beam{animation:none;} }
  @keyframes sweep{ to{ transform:translateX(-50%) rotate(360deg); } }
  .brand{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .brand-mark{display:flex; align-items:center; gap:10px;}
  .brand-name{
    font-family:var(--font-display); font-weight:700; font-size:28px;
    letter-spacing:1px; color:var(--blue-800); margin:0;
  }
  .brand-tagline{font-size:14px; color:var(--gray-600); margin:0;}
  .ods-badge{
    margin-top:6px; display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:600; color:var(--blue-700);
    background:var(--blue-50); border:1px solid var(--blue-200);
    padding:4px 10px; border-radius:999px;
  }

  /* ===== Stepper ===== */
  .stepper{display:flex; justify-content:center; gap:6px; margin-bottom:28px;}
  .step-pill{
    flex:1; max-width:120px; text-align:center; font-size:12px; font-weight:600;
    color:var(--gray-400); padding-bottom:8px; border-bottom:3px solid var(--blue-100);
    transition:.25s;
  }
  .step-pill.active{color:var(--blue-700); border-bottom-color:var(--blue-600);}
  .step-pill.done{color:var(--blue-600); border-bottom-color:var(--blue-400);}

  /* ===== Cards / sections ===== */
  .screen{animation:fadein .35s ease;}
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  h2.section-title{
    font-family:var(--font-display); font-weight:600; font-size:21px;
    color:var(--navy-900); margin:0 0 6px;
  }
  p.section-sub{color:var(--gray-600); font-size:14.5px; margin:0 0 22px;}

  /* ===== Form fields ===== */
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13.5px; font-weight:600; color:var(--blue-800); margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:12px 14px; font-size:15px; font-family:var(--font-body);
    border:1.5px solid var(--blue-200); border-radius:var(--radius-sm);
    background:var(--white); color:var(--navy-900); outline:none; transition:.2s;
  }
  .field input:focus, .field select:focus{border-color:var(--blue-600); box-shadow:0 0 0 3px var(--blue-50);}
  .field .hint{font-size:12px; color:var(--gray-400); margin-top:5px;}
  .field .error-msg{font-size:12.5px; color:var(--error); margin-top:5px; display:none;}
  .field.invalid input, .field.invalid select{border-color:var(--error);}
  .field.invalid .error-msg{display:block;}

  /* ===== Buttons ===== */
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:15px;
    border-radius:999px; padding:13px 26px; cursor:pointer; border:none;
    transition:.18s; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{background:var(--blue-700); color:var(--white);}
  .btn-primary:hover{background:var(--blue-800);}
  .btn-primary:disabled{background:var(--blue-200); cursor:not-allowed;}
  .btn-secondary{background:var(--white); color:var(--blue-700); border:1.5px solid var(--blue-200);}
  .btn-secondary:hover{border-color:var(--blue-500); background:var(--blue-50);}
  .btn-block{width:100%;}
  .actions-row{display:flex; gap:12px; margin-top:26px;}
  .actions-row .btn{flex:1;}
  .link-quiet{
    display:block; text-align:center; margin-top:22px; font-size:13.5px;
    color:var(--gray-600); text-decoration:underline; cursor:pointer; background:none; border:none;
  }

  /* ===== Icons ===== */
  .icon-circle{
    width:68px; height:68px; border-radius:50%; background:var(--blue-50);
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px;
    border:1px solid var(--blue-100);
  }
  .icon{width:30px; height:30px; color:var(--blue-700); fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}

  /* ===== Test ===== */
  .progress-track{height:6px; background:var(--blue-100); border-radius:999px; overflow:hidden; margin-bottom:22px;}
  .progress-fill{height:100%; background:var(--blue-600); border-radius:999px; transition:width .3s;}
  .q-counter{font-size:12.5px; font-weight:600; color:var(--blue-600); text-align:center; margin-bottom:14px; letter-spacing:.5px;}
  .q-text{font-family:var(--font-display); font-weight:600; font-size:19px; text-align:center; color:var(--navy-900); margin:0 0 24px;}
  .options{display:flex; flex-direction:column; gap:10px; margin-bottom:8px;}
  .option-card{
    display:flex; align-items:flex-start; gap:12px; border:1.5px solid var(--blue-100);
    border-radius:var(--radius-md); padding:13px 16px; cursor:pointer; transition:.15s; background:var(--white);
  }
  .option-card:hover{border-color:var(--blue-400); background:var(--blue-50);}
  .option-card.selected{border-color:var(--blue-600); background:var(--blue-50); box-shadow:0 0 0 1px var(--blue-600) inset;}
  .option-card input{display:none;}
  .option-letter{
    flex:0 0 26px; height:26px; border-radius:50%; background:var(--blue-100); color:var(--blue-700);
    font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .option-card.selected .option-letter{background:var(--blue-600); color:var(--white);}
  .option-text{font-size:14.5px; color:var(--navy-900); padding-top:2px;}
  .q-warning{display:none; text-align:center; color:var(--error); font-size:13px; margin-top:10px;}
  .q-warning.show{display:block;}

  /* ===== Results ===== */
  .result-greeting{font-size:15px; color:var(--gray-600); text-align:center; margin-bottom:4px;}
  .result-name{font-family:var(--font-display); font-weight:700; font-size:24px; color:var(--blue-800); text-align:center; margin:0 0 18px;}
  .justification{
    background:var(--blue-50); border:1px solid var(--blue-100); border-radius:var(--radius-md);
    padding:16px 18px; font-size:14.5px; color:var(--navy-900); margin-bottom:22px;
  }
  .career-card{
    border:1.5px solid var(--blue-200); border-radius:var(--radius-lg); padding:24px 22px;
    margin-bottom:18px; box-shadow:var(--shadow);
  }
  .area-tag{
    display:inline-block; background:var(--blue-600); color:var(--white); font-size:11.5px; font-weight:600;
    padding:4px 11px; border-radius:999px; margin-bottom:10px; letter-spacing:.3px;
  }
  .career-name{font-family:var(--font-display); font-weight:700; font-size:21px; color:var(--blue-800); margin:0 0 10px;}
  .career-desc{font-size:14.5px; color:var(--navy-900); margin:0 0 18px;}
  .meta-row{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
  .meta-chip{
    flex:1; min-width:140px; background:var(--blue-50); border:1px solid var(--blue-100);
    border-radius:var(--radius-sm); padding:10px 12px;
  }
  .meta-chip .meta-label{font-size:11px; color:var(--gray-600); font-weight:600; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px;}
  .meta-chip .meta-value{font-size:13.5px; color:var(--navy-900); font-weight:600;}
  .salida-text{font-size:14px; color:var(--gray-600); margin-bottom:4px;}
  .institucion-row{
    display:flex; align-items:flex-start; gap:10px; background:var(--blue-50);
    border:1px solid var(--blue-100); border-radius:var(--radius-sm); padding:12px 14px; margin:14px 0 4px;
  }
  .institucion-row .icon{width:18px; height:18px; flex:0 0 18px; margin-top:1px;}
  .institucion-row .institucion-text{font-size:13.5px; color:var(--navy-900);}
  .institucion-row .institucion-text strong{color:var(--blue-800);}
  .alt-title{font-size:12.5px; font-weight:600; color:var(--blue-700); margin:16px 0 8px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-size:12.5px; color:var(--blue-700); background:var(--blue-50); border:1px solid var(--blue-200); border-radius:999px; padding:5px 12px;}
  .disclaimer{font-size:12px; color:var(--gray-400); text-align:center; margin:18px 0 26px; line-height:1.5;}

  .result-actions{display:flex; flex-direction:column; gap:12px;}
  .icon-btn{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  .ods-note{
    display:flex; gap:10px; align-items:flex-start; background:var(--blue-50);
    border:1px solid var(--blue-200); border-radius:var(--radius-md); padding:16px 18px;
    margin-top:14px; font-size:13px; color:var(--gray-600); line-height:1.55;
  }
  .ods-note .icon{width:20px; height:20px; flex:0 0 20px; margin-top:1px; color:var(--blue-600);}

  footer.foot{text-align:center; font-size:12px; color:var(--gray-400); margin-top:36px;}

  @media (max-width:420px){
    .meta-row{flex-direction:column;}
    .actions-row{flex-direction:column;}
  }
</style>
</head>

/* ============================================================
   ESTADO
   ============================================================ */
const state = {
  step:1,
  qIndex:0,
  answers:{},
  userData:{nombre:'', edad:'', formacion:''},
  showQWarning:false
};

const mainQuestions = QUESTIONS.filter(q=>q.type==='main');
const totalQ = QUESTIONS.length;

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function render(){
  renderStepper();
  const el = document.getElementById('screen');
  if(state.step===1) el.innerHTML = renderStep1();
  else if(state.step===2) el.innerHTML = renderStep2();
  else el.innerHTML = renderStep3();
  el.classList.remove('screen'); void el.offsetWidth; el.classList.add('screen');
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderStepper(){
  const labels = ['Datos','Test','Resultado'];
  document.getElementById('stepper').innerHTML = labels.map((l,i)=>{
    const n=i+1;
    let cls='step-pill';
    if(n===state.step) cls+=' active';
    else if(n<state.step) cls+=' done';
    return `<div class="${cls}">${n}. ${l}</div>`;
  }).join('');
}

/* ============================================================
   PASO 1 — DATOS PERSONALES
   ============================================================ */
function renderStep1(){
  const d = state.userData;
  return `
    <h2 class="section-title">Contános un poco sobre vos</h2>
    <p class="section-sub">Estos datos nos ayudan a personalizar tu resultado. No te vamos a pedir información de más.</p>
    <div id="form1">
      <div class="field" id="f-nombre">
        <label for="in-nombre">Nombre</label>
        <input id="in-nombre" type="text" value="${escapeHtml(d.nombre)}" placeholder="Ej: Camila Pérez">
        <div class="error-msg">Contanos tu nombre para continuar.</div>
      </div>
      <div class="field" id="f-edad">
        <label for="in-edad">Edad</label>
        <input id="in-edad" type="number" min="10" max="99" value="${escapeHtml(d.edad)}" placeholder="Ej: 17">
        <div class="error-msg">Ingresá una edad válida (entre 10 y 99 años).</div>
      </div>
      <div class="field" id="f-formacion">
        <label for="in-formacion">Formación secundaria</label>
        <input id="in-formacion" type="text" value="${escapeHtml(d.formacion)}" placeholder="Ej: Bachiller, Técnico en Informática, Perito Mercantil...">
        <div class="hint">Contanos con qué título te egresaste (o te vas a egresar) de la secundaria.</div>
        <div class="error-msg">Contanos con qué título te egresaste de la secundaria.</div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="submitStep1()">Comenzar el test ${iconSvg('arrow')}</button>
  `;
}

function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function submitStep1(){
  const nombre = document.getElementById('in-nombre').value.trim();
  const edad = document.getElementById('in-edad').value.trim();
  const formacion = document.getElementById('in-formacion').value.trim();

  let valid = true;
  toggleFieldError('f-nombre', nombre.length===0); if(nombre.length===0) valid=false;
  const edadNum = Number(edad);
  const edadOk = edad.length>0 && Number.isFinite(edadNum) && edadNum>=10 && edadNum<=99;
  toggleFieldError('f-edad', !edadOk); if(!edadOk) valid=false;
  toggleFieldError('f-formacion', formacion.length===0); if(formacion.length===0) valid=false;

  if(!valid) return;

  state.userData = {nombre, edad, formacion};
  state.step = 2;
  state.qIndex = 0;
  render();
}

function toggleFieldError(id, isInvalid){
  const f = document.getElementById(id);
  if(!f) return;
  f.classList.toggle('invalid', isInvalid);
}

/* ============================================================
   PASO 2 — TEST VOCACIONAL
   ============================================================ */
function renderStep2(){
  const q = QUESTIONS[state.qIndex];
  const pct = Math.round(((state.qIndex+1)/totalQ)*100);
  const selected = state.answers[q.id];
  const optionsHtml = q.options.map(o=>{
    const isSel = selected===o.k;
    return `
      <label class="option-card${isSel?' selected':''}" for="opt-${q.id}-${o.k}">
        <input type="radio" id="opt-${q.id}-${o.k}" name="q${q.id}" value="${o.k}" ${isSel?'checked':''} onchange="selectOption(${q.id}, '${o.k}')">
        <span class="option-letter">${o.k}</span>
        <span class="option-text">${o.t}</span>
      </label>`;
  }).join('');

  const isLast = state.qIndex===totalQ-1;
  const isFirst = state.qIndex===0;

  return `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-counter">PREGUNTA ${state.qIndex+1} DE ${totalQ}</div>
    <div class="icon-circle">${iconSvg(q.icon)}</div>
    <p class="q-text">${q.text}</p>
    <div class="options">${optionsHtml}</div>
    <div class="q-warning${state.showQWarning?' show':''}">Elegí una opción para continuar.</div>
    <div class="actions-row">
      ${isFirst? `<button class="btn btn-secondary" onclick="goToStep1Edit()">Volver</button>` : `<button class="btn btn-secondary" onclick="prevQuestion()">Anterior</button>`}
      <button class="btn btn-primary" onclick="nextQuestion()">${isLast?'Ver mi resultado':'Siguiente'} ${iconSvg('arrow')}</button>
    </div>
  `;
}

function selectOption(qid, key){
  state.answers[qid] = key;
  state.showQWarning = false;
  render();
}

function nextQuestion(){
  const q = QUESTIONS[state.qIndex];
  if(!state.answers[q.id]){
    state.showQWarning = true;
    render();
    return;
  }
  state.showQWarning = false;
  if(state.qIndex < totalQ-1){
    state.qIndex++;
    render();
  } else {
    state.step = 3;
    render();
  }
}

function prevQuestion(){
  state.showQWarning = false;
  if(state.qIndex>0){ state.qIndex--; render(); }
}

function goToStep1Edit(){
  state.step = 1;
  render();
}

/* ============================================================
   PASO 3 — RESULTADO
   ============================================================ */
function computeResult(){
  const counts = {A:0,B:0,C:0,D:0};
  mainQuestions.forEach(q=>{
    const a = state.answers[q.id];
    if(a) counts[a]++;
  });
  const total = mainQuestions.length;
  let winner = 'A';
  ['A','B','C','D'].forEach(k=>{ if(counts[k] > counts[winner]) winner = k; });

  const refineQ = QUESTIONS.find(q=>q.type==='refine' && q.refineFor===winner);
  const refineAnswer = state.answers[refineQ.id] || 'A';
  const careerKey = winner + refineAnswer;
  const career = CAREERS[careerKey];

  return {
    winner, counts, total, career,
    justification: AXIS_JUSTIFICATION[winner](state.userData.nombre || 'futuro/a profesional', counts[winner], total) + ' ' + REFINE_BLURB[winner][refineAnswer]
  };
}

function renderStep3(){
  const r = computeResult();
  const c = r.career;
  const nombre = escapeHtml(state.userData.nombre || '');

  return `
    <p class="result-greeting">Esto es lo que descubrimos sobre vos</p>
    <h2 class="result-name">¡Listo, ${nombre}!</h2>

    <div class="justification">${r.justification}</div>

    <div class="career-card">
      <span class="area-tag">${c.area}</span>
      <h3 class="career-name">${c.nombre}</h3>
      <p class="career-desc">${c.desc}</p>
      <div class="meta-row">
        <div class="meta-chip">
          <div class="meta-label">Duración</div>
          <div class="meta-value">${c.duracion}</div>
        </div>
        <div class="meta-chip">
          <div class="meta-label">Área principal</div>
          <div class="meta-value">${AXIS_LABEL[r.winner]}</div>
        </div>
      </div>
      <p class="salida-text"><strong>Salida laboral:</strong> ${c.salida}</p>
      <div class="institucion-row">
        ${iconSvg('pin')}
        <div class="institucion-text"><strong>Dónde estudiarla:</strong> ${c.institucion}</div>
      </div>
      <div class="alt-title">También podrían interesarte</div>
      <div class="chips">${c.alt.map(a=>`<span class="chip">${a}</span>`).join('')}</div>
    </div>

    <p class="disclaimer">Esta es una orientación general basada en tus respuestas, no un diagnóstico definitivo. Te recomendamos confirmar planes de estudio, duración y modalidad directamente con la universidad o instituto elegido.</p>

    <div class="result-actions">
      <a class="btn btn-secondary btn-block" href="https://agenda2030lac.org/es/ods/4-educacion-de-calidad" target="_blank" rel="noopener">Conocer más sobre el ODS 4 ${iconSvg('arrow')}</a>
      <div class="ods-note">
        ${iconSvg('star')}
        <div>Este test ayuda a cumplir una de las metas del ODS 4: ampliar el acceso igualitario a la educación técnica, profesional y universitaria (incluyendo la formación a distancia). Con esta mini app buscamos facilitar la difícil decisión de elegir no solo una carrera, sino también una institución en dónde estudiarla, para ayudarte a decidir tu futuro.</div>
      </div>
    </div>
    <button class="link-quiet" onclick="restart()">Volver a empezar</button>
  `;
}

function restart(){
  state.step = 1;
  state.qIndex = 0;
  state.answers = {};
  state.showQWarning = false;
  render();
}

render();
</script>
